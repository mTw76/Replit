kind = "web"
previewPath = "/"
title = "Acro Capital Group"
version = "1.0.0"
id = "artifacts/acro-capital"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 22092
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/acro-capital run dev"

[services.env]
PORT = "22092"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/acro-capital", "run", "build"]
publicDir = "artifacts/acro-capital/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
